name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact official development toolchain
        env:
          MOONBIT_INSTALL_DEV: '1'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh '0.10.14+7d59c7ec9'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain identity
        run: moon version --all
      - name: Interface and formatting reproducibility
        run: |
          moon info
          moon fmt
          moon fmt --check
          git diff --exit-code
      - name: Strict check, build and tests
        run: |
          moon check --deny-warn --target ${{ matrix.target }}
          moon build --deny-warn --target ${{ matrix.target }}
          moon test --deny-warn --target ${{ matrix.target }}
      - name: Executable downstream assertions
        run: |
          moon run examples/probability --deny-warn --target ${{ matrix.target }}
          moon run examples/instrument --deny-warn --target ${{ matrix.target }}
          moon run examples/analysis --deny-warn --target ${{ matrix.target }}
